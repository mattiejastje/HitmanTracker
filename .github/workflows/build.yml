name: Build

on:
  push:
    branches: [ main ]
    tags: ['**']
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        preset: [x64-release]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v4.5.0
        with:
          versionSpec: '6.x'
      - name: Determine version
        id: version
        uses: gittools/actions/gitversion/execute@v4.5.0
      - name: Set up MSVC dev environment
        uses: ilammy/msvc-dev-cmd@v1
      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@master
      - name: Set up vcpkg
        uses: lukka/run-vcpkg@v11
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build out/build/${{ matrix.preset }}  -DAPP_VERSION=${{ steps.version.outputs.semVer }}
      - name: Stage release files
        shell: bash
        run: |
          STAGE_DIR="HitmanTracker-v${{ steps.version.outputs.semVer }}"
          mkdir -p "$STAGE_DIR"
          cp out/build/${{ matrix.preset }}/*.exe "$STAGE_DIR/"
          cp out/build/${{ matrix.preset }}/*.dll "$STAGE_DIR/"
          cp -r fonts "$STAGE_DIR/fonts"
          cp README.md "$STAGE_DIR/README.txt"
          cp LICENSE "$STAGE_DIR/LICENSE.txt"
          cp CHANGELOG.md "$STAGE_DIR/CHANGELOG.txt"
          echo "STAGE_DIR=${STAGE_DIR}" >> "$GITHUB_ENV"
      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HitmanTracker-v${{ steps.version.outputs.semVer }}
          path: ${{ env.STAGE_DIR }}
          if-no-files-found: warn