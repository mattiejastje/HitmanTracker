name: Build

on:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        preset: [x64-release]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up MSVC dev environment
        uses: ilammy/msvc-dev-cmd@v1
      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@master
      - name: Set up vcpkg
        uses: lukka/run-vcpkg@v11
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build out/build/${{ matrix.preset }}
      - name: Determine version
        id: version
        shell: bash
        run: |
          if [[ ! -f VERSION ]]; then
            echo "::error::VERSION file not found at repo root"
            exit 1
          fi
          BASE_VERSION=$(tr -d '[:space:]' < VERSION)
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            TAG_VERSION="${TAG#v}"
            if [[ "$TAG_VERSION" != "$BASE_VERSION" ]]; then
              echo "::error::Tag '$TAG' (version '$TAG_VERSION') does not match VERSION file ('$BASE_VERSION'). Update VERSION before tagging, or fix the tag."
              exit 1
            fi
            VERSION="$BASE_VERSION"
          else
            VERSION="${BASE_VERSION}-dev.${GITHUB_RUN_NUMBER}+${GITHUB_SHA::7}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
      - name: Stage release files
        shell: bash
        run: |
          STAGE_DIR="HitmanTracker-v${{ steps.version.outputs.version }}"
          mkdir -p "$STAGE_DIR"
          cp out/build/${{ matrix.preset }}/*.exe "$STAGE_DIR/"
          cp out/build/${{ matrix.preset }}/*.dll "$STAGE_DIR/" 2>/dev/null || true
          cp -r fonts "$STAGE_DIR/fonts"
          cp README.md "$STAGE_DIR/README.txt"
          cp LICENSE "$STAGE_DIR/LICENSE.txt"
          echo "STAGE_DIR=${STAGE_DIR}" >> "$GITHUB_ENV"
      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HitmanTracker-v${{ steps.version.outputs.version }}
          path: ${{ env.STAGE_DIR }}
          if-no-files-found: warn